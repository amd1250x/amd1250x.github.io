---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta">
    <span class="post-site">{{ site.title }}</span>
    <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
    {% if page.categories %}
      <span class="post-categories">
        Categories:
        {% for category in page.categories %}
          <a href="{{ '/category/' | append: category | downcase | relative_url }}">{{ category }}</a>{% unless forloop.last %}, {% endunless %}
        {% endfor %}
      </span>
    {% endif %}
  </div>

  {% if page.image %}
    <img class="post-image" src="{{ '/assets/img/' | append: page.image | relative_url }}" alt="{{ page.title }}">
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
</article>
