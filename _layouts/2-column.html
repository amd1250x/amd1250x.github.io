---
layout: default
---
<div class="two-column">
  {% for col in page.columns %}
    <div class="col">
      {% if col.type == "image" %}
        {% if col.image %}
          <img class="col-image" src="{{ '/assets/img/' | append: col.image | relative_url }}" alt="{{ page.display_name | default: site.title }}">
        {% endif %}
      {% else %}
        <h1 class="page-title">{{ page.title }}</h1>
        {{ content }}
      {% endif %}
    </div>
  {% endfor %}
</div>
