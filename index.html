---
layout: default
title: Home
---
<ul class="post-list">
  {% assign posts = site.food | sort: "date" | reverse %}
  {% for post in posts %}
    <li class="post-list-item">
      <h2 class="post-list-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <div class="post-meta">
        <span class="post-site">{{ site.title }}</span>
        <span class="post-date">{{ post.date | date: "%-d %B %Y" }}</span>
      </div>

      {% if post.image %}
        <a href="{{ post.url | relative_url }}">
          <img class="post-thumb" src="{{ '/assets/img/' | append: post.image | relative_url }}" alt="{{ post.title }}">
        </a>
      {% endif %}

      <p class="post-excerpt">
        {{ post.excerpt }}
        <a class="read-more" href="{{ post.url | relative_url }}">Read more</a>
      </p>
    </li>
  {% endfor %}
</ul>
