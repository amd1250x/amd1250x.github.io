<nav class="site-nav">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  {% for item in site.data.nav %}
    {% unless item.primary %}
      <a href="{{ item.link | relative_url }}" {% if page.url == item.link %}class="current"{% endif %}>{{ item.name }}</a>
    {% endunless %}
  {% endfor %}
</nav>
